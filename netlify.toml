[build]
  base    = "client"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# No backend proxy — the client's axios interceptor falls back to
# bundled mock data when /api/v1/* requests fail, so the app runs as a
# pure static demo on Netlify with no Node server required.

# Stop the SPA fallback from swallowing API requests and returning
# index.html with HTTP 200 (which breaks the mock-fallback detection in
# the client). /api/* must 404 so axios throws and the interceptor
# serves the mock.
[[redirects]]
  from   = "/api/*"
  to     = "/_api_not_found"
  status = 404

# The public pages are prerendered to real files — dist/index.html,
# dist/about/index.html and so on — and Netlify serves a matching file before
# it consults these rules, so this only catches what is left: /login and the
# application routes. It points at app.html rather than index.html because
# index.html now carries the rendered landing page, and handing that to /login
# would make React hydrate the dashboard against the marketing copy.
[[redirects]]
  from   = "/*"
  to     = "/app.html"
  status = 200
